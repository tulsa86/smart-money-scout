name: CI tests and build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test suite (offline)
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-output.log
      - name: Upload reproducible CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node24-ci-logs
          path: |
            test-output.log
            build-output.log
          if-no-files-found: warn
          retention-days: 14
