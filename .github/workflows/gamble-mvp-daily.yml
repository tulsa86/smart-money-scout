name: Gamble MVP unattended daily experiment
on:
  # Scheduled runs paused pending signed protocol approval.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smart-money-scout-writers
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test experiment calendar and code
        id: tests
        run: npm ci && npm test && node --test scripts/gamble-market-calendar.test.mjs
      - name: Run prospective decision and prior settlement
        id: experiment
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: node scripts/run-gamble-mvp-daily.mjs
      - name: Commit verified records
        if: always() && steps.tests.outcome == 'success' && (steps.experiment.outcome == 'success' || steps.experiment.outcome == 'failure')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in public/stocks/gamble-presession-journal.json public/stocks/gamble-mvp-ledger.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m "Record Gamble MVP daily observations [skip ci]"
          git pull --rebase
          git push
