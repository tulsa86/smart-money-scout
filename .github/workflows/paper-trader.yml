name: Scheduled paper trading
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-trader
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate research scripts
        run: |
          node --check scripts/research-capture.mjs
          node --check scripts/research-audit.mjs
          node --check scripts/research-analysis.mjs
          node scripts/research-test.mjs
          node scripts/paper-simulation-test.mjs
          node scripts/historical-replay-test.mjs
          node scripts/sampling-history-test.mjs
      - name: Run paper scan
        run: node scripts/paper-scan.mjs
      - name: Audit research data quality
        if: always()
        run: |
          if [ -f public/research/summary.json ]; then node scripts/research-audit.mjs; fi
      - name: Generate exploratory research analysis
        if: always()
        run: |
          if [ -f public/research/summary.json ]; then node scripts/research-analysis.mjs; fi
      - name: Generate historical replay report
        if: always()
        run: |
          if [ -f public/research/summary.json ]; then node scripts/historical-replay.mjs; fi
      - name: Commit account state
        if: always()
        run: |
          if [ ! -f public/paper-state.json ]; then exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/paper-state.json public/research/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update automated paper trading state [skip ci]"
          git push
