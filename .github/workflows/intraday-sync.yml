name: Sync historical intraday stock candles
on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: smart-money-scout-writers
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch and validate five-minute Alpaca bars
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: node scripts/alpaca-intraday-sync.mjs
      - name: Append daily forward-test observation
        run: node scripts/forward-journal.mjs
      - name: Record persistent simulated account ledger
        run: node scripts/forward-ledger.mjs
      - name: Build forward performance report
        run: node scripts/forward-report.mjs
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stocks/intraday/ public/stocks/forward-journal.json public/stocks/forward-report.json public/stocks/forward-ledger.json
          if ! git diff --cached --quiet; then
            git commit -m "Update historical stock candles"
            git pull --rebase
            # Retry transient remote errors without regenerating journal data.
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Push failed after 3 attempts; generated files were not published."
                exit 1
              fi
              echo "::warning::Push attempt $attempt failed; retrying in $((attempt * 10)) seconds."
              sleep $((attempt * 10))
            done
          fi
