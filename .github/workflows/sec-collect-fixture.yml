name: Collect genuine SEC Form 4 fixture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch fixed SEC filing and validate XML
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: node scripts/sec-collect-fixture.mjs
      - name: Preserve original SEC XML bytes and SHA-256 manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-sec-xml-fixture
          path: sec-fixture-output/
          retention-days: 30
          if-no-files-found: error
