name: Refresh SEC annual financials
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test scripts/annual-facts.test.mjs
      - name: Fetch SEC Company Facts
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: node scripts/sec-financial-sync.mjs
      - name: Save SEC financial snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stocks/annual-facts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update SEC annual financial snapshots [skip ci]"
          git pull --rebase
          git push
