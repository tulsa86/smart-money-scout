name: Compare Solana discovery sources
on:
  workflow_dispatch:
  schedule:
    - cron: '43 12 * * *'
permissions:
  contents: write
concurrency:
  group: discovery-comparison
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check script syntax
        run: node --check scripts/discovery-comparison.mjs
      - name: Run independent comparison
        run: node scripts/discovery-comparison.mjs
      - name: Commit comparison report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/research/discovery-comparison.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update discovery source comparison [skip ci]"
          git pull --rebase
          git push
