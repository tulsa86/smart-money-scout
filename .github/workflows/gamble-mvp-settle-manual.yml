name: Settle Gamble MVP simulated session (manual only)
on:
  workflow_dispatch:
    inputs:
      target_session:
        description: 'Previously committed NY trading session (YYYY-MM-DD)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: smart-money-scout-writers
  cancel-in-progress: false
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run full test suite
        run: npm ci && npm test
      - name: Settle precommitted simulated session only
        env:
          GAMBLE_TARGET_SESSION: ${{ inputs.target_session }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: node scripts/settle-gamble-mvp.mjs
      - name: Commit simulated MVP ledger only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stocks/gamble-mvp-ledger.json
          git diff --cached --quiet && exit 0
          git commit -m "Record simulated Gamble MVP settlement [skip ci]"
          git pull --rebase
          git push
